[build]
  # Eleventy genera solo /blog a partire da _blog/. Il resto del sito è HTML
  # statico già presente nel repository e viene pubblicato così com'è.
  # Se questa build fallisce Netlify non pubblica e lascia online il deploy
  # precedente: un errore nel blog non può mandare giù il sito.
  command = "npm run build"
  publish = "."

[[redirects]]
  from   = "https://www.corradogizzi.it/*"
  to     = "https://corradogizzi.it/:splat"
  status = 301
  force  = true

# Gli URL /…/index.html sono duplicati della forma canonica /…/ : Search Console
# li segnalava come "Pagina alternativa con tag canonical appropriato". I link
# interni ora puntano già alla forma giusta; questi 301 consolidano gli URL che
# Google ha comunque scoperto e li tolgono dalla coda di scansione.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:sezione/index.html"
  to = "/:sezione/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/:articolo/index.html"
  to = "/blog/:articolo/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
# Netlify serve .webmanifest come application/octet-stream: alcuni browser
# lo ignorano e non offrono l'aggiunta alla schermata home.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
